[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "condor-bench"
version = "0.1.0"
description = "LLM benchmarking suite for the Condor trading assistant"
requires-python = ">=3.12"
dependencies = [
    # LLM framework + MCP (condor's client is vendored in condor_compat/). The same
    # majors condor's main runs (0ea6e353, the MCP SDK v2 move): the vendored
    # pydantic_ai_client.py follows condor's port to the 2.x MCP toolset, and
    # bench's own teardown speaks to condor's servers with the mcp client directly.
    "pydantic-ai>=2.52,<3",
    "mcp>=2.2,<3",
    "openai>=1.0",
    # Offline price snapshot behind estimate_cost_usd(), and — via
    # pydantic_ai.usage.RequestUsage.extract — the thing that parses token counts
    # off an OpenAI-compatible response. A transitive dep of pydantic-ai (which
    # only asks for >=0.0.62), pinned to a window here because both edges bite:
    #
    #   < 0.0.68  no claude-sonnet-5 / claude-opus-5 entry, so every Claude 5 run
    #             reported tokens with no cost and the dashboard showed "—".
    #   < 0.1.9   paired with pydantic-ai 1.x, 0.1.x returned an
    #             `output_reasoning_tokens` field its RequestUsage would not take,
    #             and `extract()` zeroed the usage of every reasoning model
    #             (deepseek, o-series, qwen-thinking). pydantic-ai 2.x extracts a
    #             reasoning response cleanly with 0.1.9 — the version condor locks.
    "genai-prices>=0.1.9,<0.2",
    "httpx>=0.27",
    # condor's config_manager, which bench imports in-process to build every MCP
    # server config (bench/mcp_provider.py), needs it. It only ever arrived through
    # fastmcp 3.x, so the mcp 2.x upgrade that dropped fastmcp broke every run.
    "aiohttp>=3.13",
    "anthropic>=0.40",
    # CLI + dashboard API
    "rich>=13.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Data
    "pandas>=2.0",
    "plotly>=5.0",
    "python-dotenv>=1.0",
    # Reads the YAML frontmatter of condor's AGENT.md files for each agent's tool
    # grant. Was only transitively available before, which is the kind of thing
    # that breaks when an unrelated dependency drops it.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
condor-bench = "runner:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["bench*", "metrics*", "mock_mcp*", "dashboard*", "condor_compat*", "config*", "runner*"]

[dependency-groups]
dev = [
    "python-telegram-bot[job-queue]>=22.8",
]
