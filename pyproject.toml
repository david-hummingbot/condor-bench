[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "condor-bench"
version = "0.1.0"
description = "LLM benchmarking suite for the Condor trading assistant"
requires-python = ">=3.12"
dependencies = [
    # LLM framework + MCP (condor's client is vendored in condor_compat/)
    # Must stay on 1.x — condor uses 1.78.0 and the vendored pydantic_ai_client.py
    # uses MCPServerStdio which was removed in pydantic-ai 2.0.
    "pydantic-ai[mcp]>=1.78,<2.0",
    "openai>=1.0",
    # Offline price snapshot behind estimate_cost_usd(), and — via
    # pydantic_ai.usage.RequestUsage.extract — the thing that parses token counts
    # off an OpenAI-compatible response. A transitive dep of pydantic-ai (which
    # only asks for >=0.0.62), pinned to a window here because both edges bite:
    #
    #   < 0.0.68  no claude-sonnet-5 / claude-opus-5 entry, so every Claude 5 run
    #             reported tokens with no cost and the dashboard showed "—".
    #   >= 0.1.0  extraction returns an `output_reasoning_tokens` field that
    #             pydantic-ai 1.x's RequestUsage will not accept. `extract()`
    #             catches the TypeError and returns a zeroed usage, so any
    #             reasoning model on the OpenAI-compatible path (deepseek, o-series,
    #             qwen-thinking) silently reported *no tokens at all* — and only
    #             reasoning models, which is what made it look model-specific.
    #             Revisit when pydantic-ai 1.x accepts that field.
    "genai-prices>=0.0.73,<0.1.0",
    "httpx>=0.27",
    # Evaluation
    "deepeval>=2.0",
    "anthropic>=0.40",
    # CLI + dashboard API
    "rich>=13.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Data
    "pandas>=2.0",
    "plotly>=5.0",
    "python-dotenv>=1.0",
    # Reads the YAML frontmatter of condor's AGENT.md files for each agent's tool
    # grant. Was only transitively available before, which is the kind of thing
    # that breaks when an unrelated dependency drops it.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
condor-bench = "runner:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["bench*", "metrics*", "mock_mcp*", "dashboard*", "condor_compat*", "config*", "runner*"]

[dependency-groups]
dev = [
    "python-telegram-bot[job-queue]>=22.8",
]
